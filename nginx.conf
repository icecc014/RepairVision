server {
    listen       80;
    server_name  _;

    # 8080 / 8081 共用同一 server，重定向必须是相对地址，否则会丢掉端口
    absolute_redirect off;
    port_in_redirect off;

    # V9.4 公网加固：从隧道透传的 X-Forwarded-For 中解析真实客户端 IP。
    # 只信任 Docker 发布端口的来源（穿透与局域网请求在 nginx 眼里都来自该网关）；
    # 绝不能写 0.0.0.0/0，否则客户端可伪造 XFF 绕过公共报修限流。
    set_real_ip_from 172.18.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 统一登录页（V9）：根路径与 /login 都进入统一登录页
    location = / {
        return 302 /login/;
    }

    location = /login {
        return 302 /login/;
    }

    location /login/ {
        alias /usr/share/nginx/html/login/;
        index  index.html;
        try_files $uri $uri/ /login/index.html;
    }
    # PC 管理端
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index  index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 移动端 H5
    location /m/ {
        alias /usr/share/nginx/html/m/;
        index  index.html;
        try_files $uri $uri/ /m/index.html;
    }

    # 浏览器默认请求的根图标：重定向到移动端 favicon（否则 404）
    location = /favicon.ico { return 301 /m/favicon.svg; }

    # 角色直达短入口：302 到移动端 SPA 路由（前端 base 为 /m/，故用跳转而非目录映射）
    location = /dorm   { return 302 /m/dorm; }
    location = /worker { return 302 /m/worker; }
    location = /report { return 302 /m/report; }

    # 后端 HTTP API
    location /api/ {
        proxy_pass http://order-api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # V9.4：覆盖为真实客户端 IP，丢弃客户端伪造的前缀
    }

    # P0 健康链路（order-api /ping/:name）
    location /ping/ {
        proxy_pass http://order-api:8888;
        proxy_set_header Host $host;
    }

    # WebSocket（独立 8890 端口承载，go-zero rest 不支持 Hijacker）
    location /ws/ {
        proxy_pass http://order-api:8890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}