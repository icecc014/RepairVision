syntax = "proto3";

package map;
option go_package="./map";

message Request {
  string ping = 1;
}

message Response {
  string pong = 1;
}

message Building {
  int64 id = 1;
  string code = 2;
  string name = 3;
  double pos_x = 4;
  double pos_y = 5;
  double width = 6;
  double height = 7;
  int64 floors = 8;
  double floor_height = 9;
  int64 rooms_per_floor = 10;
}

message ListBuildingsRequest {
}

message ListBuildingsResponse {
  repeated Building buildings = 1;
}

message SaveBuildingRequest {
  Building building = 1;
}

message FaultMarkerUpsertRequest {
  int64 order_id = 1;
  int64 building_id = 2;
  int64 floor = 3;
  string room_number = 4;
}

message FaultMarkerOrderRequest {
  int64 order_id = 1;
}
message BuildingIdRequest {
  int64 id = 1;
}

message BuildingResponse {
  Building building = 1;
}

service Map {
  rpc Ping(Request) returns(Response);
  rpc ListBuildings(ListBuildingsRequest) returns(ListBuildingsResponse);
  rpc GetBuilding(BuildingIdRequest) returns(BuildingResponse);
  rpc CreateBuilding(SaveBuildingRequest) returns(BuildingResponse);
  rpc UpdateBuilding(SaveBuildingRequest) returns(BuildingResponse);
  rpc DeleteBuilding(BuildingIdRequest) returns(Response);
  rpc UpsertFaultMarker(FaultMarkerUpsertRequest) returns(Response);
  rpc RemoveFaultMarker(FaultMarkerOrderRequest) returns(Response);
}