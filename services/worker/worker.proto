syntax = "proto3";

package worker;
option go_package="./worker";

message Request {
  string ping = 1;
}

message Response {
  string pong = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message User {
  int64 id = 1;
  string username = 2;
  int64 role = 3;
  string name = 4;
  string phone = 5;
  int64 building_id = 6;
  int64 status = 7;
  repeated int64 building_ids = 8;
  int64 max_concurrent = 9;
}

message LoginResponse {
  User user = 1;
}

message BuildingWorkersRequest {
  int64 building_id = 1;
  string work_date = 2;
}

message SkillInfo {
  string name = 1;
  int64 proficiency = 2;
}

message WorkerInfo {
  int64 id = 1;
  string username = 2;
  string name = 3;
  string phone = 4;
  int64 base_building_id = 5;
  repeated SkillInfo skills = 6;
  int64 max_concurrent = 7;
  string today_shift = 8;
}

message BuildingWorkersResponse {
  repeated WorkerInfo workers = 1;
}

message UserIdsRequest {
  repeated int64 ids = 1;
}

message UsersResponse {
  repeated User users = 1;
}

message ListUsersRequest {
  int64 role = 1;
  int64 status = 2;
  string keyword = 3;
}

message ListUsersResponse {
  repeated User users = 1;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string name = 3;
  string phone = 4;
  int64 role = 5;
  int64 building_id = 6;
  repeated int64 building_ids = 7;
  int64 max_concurrent = 8;
}

message UpdateUserRequest {
  int64 id = 1;
  string name = 2;
  string phone = 3;
  int64 role = 4;
  int64 building_id = 5;
  repeated int64 building_ids = 6;
  int64 status = 7;
  int64 max_concurrent = 8;
}

message IdRequest {
  int64 id = 1;
}

message BuildingIdsResponse {
  repeated int64 ids = 1;
}
message ResetPasswordRequest {
  int64 id = 1;
  string password = 2;
}

service Worker {
  rpc Ping(Request) returns(Response);
  rpc Login(LoginRequest) returns(LoginResponse);
  rpc ListWorkersByBuilding(BuildingWorkersRequest) returns(BuildingWorkersResponse);
  rpc GetUsers(UserIdsRequest) returns(UsersResponse);
  rpc ListUsers(ListUsersRequest) returns(ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns(UsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns(UsersResponse);
  rpc ResetPassword(ResetPasswordRequest) returns(Response);
  rpc DisableUser(IdRequest) returns(Response);
  rpc ListManagedBuildings(IdRequest) returns(BuildingIdsResponse);
  rpc ListSchedules(ScheduleListRequest) returns(ScheduleListResponse);
  rpc SaveSchedules(SaveSchedulesRequest) returns(ScheduleListResponse);
  rpc GenerateWeekly(GenerateScheduleRequest) returns(ScheduleListResponse);
  rpc SubmitLeave(SubmitLeaveRequest) returns(LeaveItem);
  rpc ListLeaves(ListLeavesRequest) returns(ListLeavesResponse);
  rpc ReviewLeave(ReviewLeaveRequest) returns(LeaveItem);
  rpc CancelLeave(LeaveIdRequest) returns(LeaveItem);
}

message ScheduleItem {
  int64 worker_id = 1;
  string work_date = 2;
  string shift_type = 3;
  string note = 4;
}

message ScheduleListRequest {
  int64 worker_id = 1;
  string start_date = 2;
  string end_date = 3;
}

message ScheduleListResponse {
  repeated ScheduleItem items = 1;
}

message SaveSchedulesRequest {
  repeated ScheduleItem items = 1;
}

message GenerateScheduleRequest {
  string week_start = 1;
}

message LeaveItem {
  int64 id = 1;
  int64 worker_id = 2;
  string start_date = 3;
  string end_date = 4;
  string reason = 5;
  int64 status = 6;
  int64 reviewer_id = 7;
  string review_note = 8;
  string created_at = 9;
}

message SubmitLeaveRequest {
  int64 worker_id = 1;
  string start_date = 2;
  string end_date = 3;
  string reason = 4;
}

message ListLeavesRequest {
  int64 worker_id = 1;
  int64 status = 2;
  int64 page = 3;
  int64 size = 4;
  int64 days = 5;
}

message ListLeavesResponse {
  int64 total = 1;
  repeated LeaveItem items = 2;
}

message ReviewLeaveRequest {
  int64 id = 1;
  int64 status = 2;
  int64 reviewer_id = 3;
  string review_note = 4;
}

message LeaveIdRequest {
  int64 id = 1;
  int64 worker_id = 2;
}
