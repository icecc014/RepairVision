syntax = "proto3";

package worker;
option go_package="./worker";

message Request {
  string ping = 1;
}

message Response {
  string pong = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message User {
  int64 id = 1;
  string username = 2;
  int64 role = 3;
  string name = 4;
  string phone = 5;
  int64 building_id = 6;
  int64 status = 7;
}

message LoginResponse {
  User user = 1;
}

message BuildingWorkersRequest {
  int64 building_id = 1;
}

message WorkerInfo {
  int64 id = 1;
  string username = 2;
  string name = 3;
  string phone = 4;
}

message BuildingWorkersResponse {
  repeated WorkerInfo workers = 1;
}

message UserIdsRequest {
  repeated int64 ids = 1;
}

message UsersResponse {
  repeated User users = 1;
}

service Worker {
  rpc Ping(Request) returns(Response);
  rpc Login(LoginRequest) returns(LoginResponse);
  rpc ListWorkersByBuilding(BuildingWorkersRequest) returns(BuildingWorkersResponse);
  rpc GetUsers(UserIdsRequest) returns(UsersResponse);
}