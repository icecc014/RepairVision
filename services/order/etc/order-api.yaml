Name: order-api
Host: 0.0.0.0
Port: 8888
Timeout: 30000
Auth:
  AccessSecret: ${JWT_SECRET}
  AccessExpire: 86400
DB:
  DataSource: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/order_db?charset=utf8mb4&parseTime=true&loc=Local"
Kafka:
  Enabled: true
  Brokers:
    - kafka:9092
  Topic: operation-logs
  Group: order-oplog-group
WorkerRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: worker-rpc
  Timeout: 30000
MapRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: map-rpc
  Timeout: 30000